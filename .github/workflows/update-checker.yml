name: Update Checker

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Dispatch a dual-profile build even when the lock fingerprint is unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 */18 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: openwrt-update-checker
  cancel-in-progress: true

jobs:
  check:
    name: Resolve the complete upstream fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current default-branch implementation
        uses: actions/checkout@main

      - name: Resolve one dual-profile source lock
        id: lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .source-state
          profiles="$(bash scripts/render-profile.sh list | paste -sd, -)"
          [ -n "$profiles" ] || {
            echo '::error::No device profiles were discovered'
            exit 2
          }
          bash scripts/resolve-source-lock.sh resolve \
            "$profiles" .source-state/source-lock.json
          digest="$(bash scripts/resolve-source-lock.sh digest .source-state/source-lock.json)"
          echo "source_digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Resolved complete fingerprint: $digest"

      - name: Look up the exact lock fingerprint
        id: fingerprint
        uses: actions/cache@main
        with:
          path: .source-state
          key: source-lock-v5-${{ steps.lock.outputs.source_digest }}

      - name: Show changed immutable inputs
        if: steps.fingerprint.outputs.cache-hit != 'true' || inputs.force_build == true
        shell: bash
        run: |
          python3 scripts/source_lock.py summary .source-state/source-lock.json

      - name: Dispatch the exact source lock to the dual build
        if: steps.fingerprint.outputs.cache-hit != 'true' || inputs.force_build == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.lock.outputs.source_digest }}
        run: |
          set -euo pipefail
          source_lock_b64="$(base64 -w0 .source-state/source-lock.json)"
          jq -n \
            --arg event_type source-lock-update \
            --arg profile all \
            --arg source_lock_b64 "$source_lock_b64" \
            --arg source_digest "$SOURCE_DIGEST" \
            '{event_type: $event_type, client_payload: {profile: $profile, source_lock_b64: $source_lock_b64, source_digest: $source_digest}}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Report unchanged fingerprint
        if: steps.fingerprint.outputs.cache-hit == 'true' && inputs.force_build != true
        run: echo 'Lean, feeds, source overlays, controlled releases, BBRv3 ports, profiles and patches are unchanged.'

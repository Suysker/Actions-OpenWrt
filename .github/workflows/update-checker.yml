name: Update Checker

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Dispatch a dual-profile build even when the lock fingerprint is unchanged
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '0 */18 * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: openwrt-update-checker
  cancel-in-progress: true

jobs:
  check:
    name: Resolve the complete upstream fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current default-branch implementation
        uses: actions/checkout@main

      - name: Resolve one dual-profile source lock
        id: lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .source-state
          bash scripts/resolve-source-lock.sh resolve \
            'r4s,x86-n5105-pve' .source-state/source-lock.json
          digest="$(bash scripts/resolve-source-lock.sh digest .source-state/source-lock.json)"
          echo "source_digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Resolved complete fingerprint: $digest"

      - name: Look up the exact lock fingerprint
        id: fingerprint
        uses: actions/cache@main
        with:
          path: .source-state
          key: source-lock-v3-${{ steps.lock.outputs.source_digest }}

      - name: Show changed immutable inputs
        if: steps.fingerprint.outputs.cache-hit != 'true' || inputs.force_build == true
        shell: bash
        run: |
          python3 - .source-state/source-lock.json <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1], encoding="utf-8"))
          print("OpenWrt:", lock["openwrt"]["commit"])
          print(
              "Source overlays:",
              ", ".join(
                  f"{name}@{entry['commit']}"
                  for name, entry in sorted(lock["source_overlays"].items())
              ),
          )
          for name, feed in lock["feeds"].items():
              print(f"Feed {name}: {feed['commit']}")
          for name, artifact in lock["upstream_artifacts"].items():
              print(f"Artifact {name}: {artifact.get('version', artifact.get('tag'))}")
          for profile, entry in lock["profiles"].items():
              print(f"{profile}: Linux {entry['kernel_version']}")
          for series, port in lock["kernel_features"]["bbr3"]["ports"].items():
              print(f"BBRv3 {series}: {port['provider']}@{port['origin_commit']}")
          for name, action in lock["actions"].items():
              print(f"Action {name}@main observed at {action['commit']}")
          PY

      - name: Dispatch the exact source lock to the dual build
        if: steps.fingerprint.outputs.cache-hit != 'true' || inputs.force_build == true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.lock.outputs.source_digest }}
        run: |
          set -euo pipefail
          source_lock_b64="$(base64 -w0 .source-state/source-lock.json)"
          jq -n \
            --arg event_type source-lock-update \
            --arg profile all \
            --arg source_lock_b64 "$source_lock_b64" \
            --arg source_digest "$SOURCE_DIGEST" \
            '{event_type: $event_type, client_payload: {profile: $profile, source_lock_b64: $source_lock_b64, source_digest: $source_digest}}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

      - name: Report unchanged fingerprint
        if: steps.fingerprint.outputs.cache-hit == 'true' && inputs.force_build != true
        run: echo 'Lean, feeds, official package overrides, controlled releases, BBRv3 ports, profiles, patches and observed Actions HEADs are unchanged.'

name: OpenWrt Upstream Update Monitor

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: openwrt-update-checker
  cancel-in-progress: true

jobs:
  check:
    name: Evaluate Scheduled Firmware Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Monitoring Configuration
        uses: actions/checkout@main

      - name: Resolve Current Dual-Profile Source Lock
        id: lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .source-state
          profiles="$(bash scripts/render-profile.sh list | paste -sd, -)"
          [ -n "$profiles" ] || {
            echo '::error::No device profiles were discovered'
            exit 2
          }
          bash scripts/resolve-source-lock.sh resolve \
            "$profiles" .source-state/source-lock.json
          digest="$(bash scripts/resolve-source-lock.sh digest .source-state/source-lock.json)"
          echo "source_digest=${digest#sha256:}" >> "$GITHUB_OUTPUT"
          echo "Resolved complete fingerprint: $digest"

      - name: Evaluate Released Compatibility Boundary
        id: decision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason=routine
          detail='No compatibility boundary changed; the weekly build is not due.'

          if [ "$(TZ=Asia/Shanghai date +%u)" = 1 ]; then
            reason=weekly
            detail='The scheduled weekly refresh is due.'
          else
            release_tag=''
            if release_tag="$(
              gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                --json tagName,createdAt,isDraft \
                --jq '[.[] | select(.isDraft == false and (.tagName | startswith("openwrt-")))] | sort_by(.createdAt) | last | .tagName // ""'
            )" && [ -n "$release_tag" ]; then
              mkdir -p .source-state/released
              if gh release download "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --pattern source-lock.json \
                --dir .source-state/released; then
                if python3 scripts/source_lock.py update-impact \
                  .source-state/released/source-lock.json \
                  .source-state/source-lock.json > .source-state/update-impact.json; then
                  reason="$(jq -er \
                    '.classification | select(. == "significant" or . == "routine")' \
                    .source-state/update-impact.json)"
                  if [ "$reason" = significant ]; then
                    impact="$(jq -r '.reasons | join(", ")' \
                      .source-state/update-impact.json)"
                    detail="Released compatibility boundary changed: $impact"
                  fi
                else
                  reason=significant
                  detail='The released source lock cannot be validated; rebuild to establish a current baseline.'
                fi
              else
                reason=significant
                detail='The latest OpenWrt Release has no readable source-lock baseline.'
              fi
            else
              reason=significant
              detail='No published OpenWrt Release baseline exists.'
            fi
          fi

          case "$reason" in
            weekly|significant)
              dispatch=true
              ;;
            routine)
              dispatch=false
              ;;
            *)
              echo "::error::Unknown automatic build decision: $reason"
              exit 2
              ;;
          esac

          printf 'reason=%s\ndispatch=%s\n' "$reason" "$dispatch" >> "$GITHUB_OUTPUT"
          {
            echo '### Automatic build decision'
            echo "- Decision: \`$reason\`"
            echo "- Detail: $detail"
            echo "- Current source lock: \`sha256:${{ steps.lock.outputs.source_digest }}\`"
            echo
            python3 scripts/source_lock.py summary .source-state/source-lock.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Scheduled Firmware Build
        if: steps.decision.outputs.dispatch == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIGEST: ${{ steps.lock.outputs.source_digest }}
        run: |
          set -euo pipefail
          source_lock_b64="$(base64 -w0 .source-state/source-lock.json)"
          jq -n \
            --arg event_type source-lock-update \
            --arg profile all \
            --arg source_lock_b64 "$source_lock_b64" \
            --arg source_digest "$SOURCE_DIGEST" \
            '{event_type: $event_type, client_payload: {profile: $profile, source_lock_b64: $source_lock_b64, source_digest: $source_digest}}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" --input -

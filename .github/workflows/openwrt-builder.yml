name: OpenWrt Builder

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile directory name, or all for a production Release
        required: true
        default: all
        type: string
      haproxy_version:
        description: Optional exact HAProxy LTS rollback version
        required: false
        type: string
      adguardhome_version:
        description: Optional exact AdGuardHome stable rollback version
        required: false
        type: string
      geoip_tag:
        description: Optional exact GeoIP release tag
        required: false
        type: string
      geosite_tag:
        description: Optional exact Geosite release tag
        required: false
        type: string
  repository_dispatch:
    types: [source-lock-update]

permissions:
  contents: read

concurrency:
  group: openwrt-production-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  prepare:
    name: Resolve immutable inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      publish: ${{ steps.select.outputs.publish }}
      source_digest: ${{ steps.lock.outputs.source_digest }}
    steps:
      - name: Checkout implementation
        uses: actions/checkout@main

      - name: Select profiles
        id: select
        shell: bash
        env:
          MANUAL_PROFILE: ${{ inputs.profile }}
          DISPATCH_PROFILE: ${{ github.event.client_payload.profile }}
        run: |
          set -euo pipefail
          requested="${MANUAL_PROFILE:-${DISPATCH_PROFILE:-all}}"
          mapfile -t available < <(bash scripts/render-profile.sh list)
          [ "${#available[@]}" -gt 0 ] || {
            echo '::error::No device profiles were discovered'
            exit 2
          }
          if [ "$requested" = all ]; then
            selected=("${available[@]}")
            publish=true
          else
            selected=()
            for profile in "${available[@]}"; do
              [ "$requested" != "$profile" ] || selected+=("$profile")
            done
            [ "${#selected[@]}" -eq 1 ] || {
              echo "::error::Unknown profile: $requested"
              exit 2
            }
            publish=false
          fi
          matrix="$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc '{profile: .}')"
          profiles="$(IFS=,; echo "${selected[*]}")"
          printf 'matrix=%s\nprofiles=%s\npublish=%s\n' \
            "$matrix" "$profiles" "$publish" >> "$GITHUB_OUTPUT"

      - name: Resolve or accept one source lock
        id: lock
        shell: bash
        env:
          PROFILES: ${{ steps.select.outputs.profiles }}
          INCOMING_LOCK_B64: ${{ github.event.client_payload.source_lock_b64 }}
          EXPECTED_DIGEST: ${{ github.event.client_payload.source_digest }}
          HAPROXY_VERSION: ${{ inputs.haproxy_version }}
          ADGUARDHOME_VERSION: ${{ inputs.adguardhome_version }}
          GEOIP_TAG: ${{ inputs.geoip_tag }}
          GEOSITE_TAG: ${{ inputs.geosite_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/source_lock.py validate-actions .github/workflows/*.yml
          lock_dir="$RUNNER_TEMP/source-lock"
          mkdir -p "$lock_dir"
          lock="$lock_dir/source-lock.json"

          if [ -n "$INCOMING_LOCK_B64" ]; then
            printf '%s' "$INCOMING_LOCK_B64" | base64 --decode > "$lock"
            locked_repo_commit="$(python3 scripts/source_lock.py repository-commit "$lock")"
            [ "$locked_repo_commit" = "$(git rev-parse HEAD)" ] || {
              echo "::error::Incoming source lock belongs to repository commit $locked_repo_commit, not $(git rev-parse HEAD)"
              exit 1
            }
          else
            bash scripts/resolve-source-lock.sh resolve "$PROFILES" "$lock"
          fi

          bash scripts/resolve-source-lock.sh materialize "$lock" "$lock_dir"

          digest="$(bash scripts/resolve-source-lock.sh digest "$lock")"
          digest_hex="${digest#sha256:}"
          if [ -n "$EXPECTED_DIGEST" ] && [ "$EXPECTED_DIGEST" != "$digest_hex" ]; then
            echo "::error::Incoming source-lock digest differs from dispatch metadata"
            exit 1
          fi
          echo "source_digest=$digest_hex" >> "$GITHUB_OUTPUT"
          echo "Source lock: $digest"

      - name: Preflight the exact BBRv3 kernel ports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t versions < <(python3 scripts/source_lock.py kernel-versions \
            "$RUNNER_TEMP/source-lock/source-lock.json")
          for version in "${versions[@]}"; do
            bash scripts/check-bbrv3-port.sh "$RUNNER_TEMP/source-lock/source-lock.json" "$version"
          done

      - name: Upload immutable build inputs
        uses: actions/upload-artifact@main
        with:
          name: source-lock
          path: ${{ runner.temp }}/source-lock
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ${{ matrix.profile }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      SOURCE_LOCK: ${{ github.workspace }}/source-input/source-lock.json
      OPENWRT_ROOT: /builder/openwrt
      CCACHE_DIR: /builder/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Checkout implementation
        uses: actions/checkout@main

      - name: Download immutable build inputs
        uses: actions/download-artifact@main
        with:
          name: source-lock
          path: source-input

      - name: Load profile and cache identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          digest="$(bash scripts/resolve-source-lock.sh digest "$SOURCE_LOCK")"
          [ "${digest#sha256:}" = "${{ needs.prepare.outputs.source_digest }}" ]
          bash scripts/render-profile.sh env "$PROFILE" "$RUNNER_TEMP/profile.env"
          cat "$RUNNER_TEMP/profile.env" >> "$GITHUB_ENV"
          python3 scripts/source_lock.py profile-identity \
            "$SOURCE_LOCK" "$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Prepare bounded runner workspace
        id: runner
        shell: bash
        run: bash scripts/prepare-runner.sh "$GITHUB_WORKSPACE/runner-report.txt"

      - name: Install build prerequisites
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler file flex g++ \
            g++-multilib gawk gcc-multilib gettext git gperf help2man intltool \
            jq kmod libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool ninja-build p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils \
            rsync scons squashfs-tools subversion swig texinfo unzip wget \
            xmlto xxd zlib1g-dev

      - name: Checkout locked Lean source
        shell: bash
        run: |
          set -euo pipefail
          readarray -t source < <(python3 scripts/source_lock.py \
            openwrt-source "$SOURCE_LOCK")
          git init -q "$OPENWRT_ROOT"
          git -C "$OPENWRT_ROOT" remote add origin "${source[0]}"
          git -C "$OPENWRT_ROOT" fetch --depth 1 origin "${source[1]}"
          git -C "$OPENWRT_ROOT" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$OPENWRT_ROOT" rev-parse HEAD)" = "${source[1]}" ]
          mkdir -p "$OPENWRT_ROOT/dl" "$CCACHE_DIR"

      - name: Restore source downloads
        uses: actions/cache@main
        with:
          path: /builder/openwrt/dl
          key: openwrt-dl-${{ runner.os }}-${{ needs.prepare.outputs.source_digest }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Restore profile ccache
        uses: actions/cache@main
        with:
          path: /builder/.ccache
          key: openwrt-ccache-${{ runner.os }}-gcc15-${{ matrix.profile }}-${{ steps.identity.outputs.profile_digest }}-${{ steps.identity.outputs.patch_digest }}-${{ needs.prepare.outputs.source_digest }}
          restore-keys: |
            openwrt-ccache-${{ runner.os }}-gcc15-${{ matrix.profile }}-${{ steps.identity.outputs.profile_digest }}-${{ steps.identity.outputs.patch_digest }}-

      - name: Render profile declarations
        shell: bash
        run: |
          set -euo pipefail
          profile_dir="$GITHUB_WORKSPACE/profile-input"
          bash scripts/render-profile.sh bundle "$PROFILE" "$profile_dir"

      - name: Checkout locked feeds and select providers
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"
          bash "$GITHUB_WORKSPACE/diy-part1.sh" "$SOURCE_LOCK" feeds.conf.default
          ./scripts/feeds update -a
          bash "$GITHUB_WORKSPACE/scripts/select-package-providers.sh" \
            "$OPENWRT_ROOT" "$GITHUB_WORKSPACE/provider-selection-report.txt"
          bash "$GITHUB_WORKSPACE/scripts/sync-source-overlays.sh" \
            apply-lock "$SOURCE_LOCK" "$OPENWRT_ROOT"
          bash "$GITHUB_WORKSPACE/scripts/manage-custom-feeds.sh" \
            reindex-lock "$SOURCE_LOCK" "$OPENWRT_ROOT"
          bash "$GITHUB_WORKSPACE/scripts/install-profile-feeds.sh" \
            "$OPENWRT_ROOT" "$GITHUB_WORKSPACE/profile-input/required.txt" \
            "$GITHUB_WORKSPACE/profile-feed-install-report.txt"

      - name: Apply locked artifacts and profile patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"
          bash "$GITHUB_WORKSPACE/diy-part2.sh" \
            "$SOURCE_LOCK" "$GITHUB_WORKSPACE/artifact-override-report.json"
          bash "$GITHUB_WORKSPACE/scripts/apply-profile-patches.sh" \
            "$PROFILE" "$OPENWRT_ROOT" "$SOURCE_LOCK" "$GITHUB_WORKSPACE/patch-report.txt"

      - name: Install profile configuration and rootfs
        shell: bash
        run: |
          set -euo pipefail
          profile_dir="$GITHUB_WORKSPACE/profile-input"
          [ ! -e "$OPENWRT_ROOT/files" ] || {
            echo "::error::Locked OpenWrt source unexpectedly owns $OPENWRT_ROOT/files"
            exit 1
          }
          cp -a "$profile_dir/files" "$OPENWRT_ROOT/files"
          cp "$profile_dir/config.seed" "$OPENWRT_ROOT/.config"

      - name: Resolve Kconfig contracts
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/normalize-forbidden-suboptions.py" apply \
            .config "$GITHUB_WORKSPACE/profile-input/forbidden.txt" \
            "$GITHUB_WORKSPACE/forbidden-suboptions-report.txt" \
            tmp/.config-package.in
          make defconfig
          python3 "$GITHUB_WORKSPACE/scripts/normalize-forbidden-suboptions.py" check \
            .config "$GITHUB_WORKSPACE/profile-input/forbidden.txt" \
            "$GITHUB_WORKSPACE/forbidden-suboptions-check.txt"
          ./scripts/diffconfig.sh | tee "$GITHUB_WORKSPACE/config.effective"

      - name: Download and prepare selected kernel sources
        shell: bash
        run: |
          set -euo pipefail
          cd "$OPENWRT_ROOT"
          make download -j8
          make target/linux/prepare

      - name: Validate final profile contract
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/check-profile-contract.sh" \
            "$PROFILE" "$OPENWRT_ROOT" "$SOURCE_LOCK" \
            "$GITHUB_WORKSPACE/profile-contract-report.txt" "$GITHUB_WORKSPACE"

      - name: Compile firmware once in parallel
        shell: bash
        env:
          BUILD_JOBS: ${{ steps.runner.outputs.build_jobs }}
        run: |
          set -euo pipefail
          export CCACHE_DIR CCACHE_MAXSIZE
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --zero-stats
          cd "$OPENWRT_ROOT"
          set -o pipefail
          if ! make -j"$BUILD_JOBS" 2>&1 | tee "$GITHUB_WORKSPACE/build.parallel.log"; then
            bash "$GITHUB_WORKSPACE/scripts/collect-build-failure-diagnostics.sh" \
              "$OPENWRT_ROOT" "$GITHUB_WORKSPACE/build.parallel.log" \
              "$GITHUB_WORKSPACE/build.serial.log"
            exit 1
          fi
          ccache --show-stats | tee "$GITHUB_WORKSPACE/ccache-stats.txt"

      - name: Collect and verify firmware provenance
        shell: bash
        run: |
          set -euo pipefail
          delivery="$GITHUB_WORKSPACE/delivery/$PROFILE"
          bash scripts/collect-build-provenance.sh \
            "$PROFILE" "$OPENWRT_ROOT" "$SOURCE_LOCK" \
            "$GITHUB_WORKSPACE/artifact-override-report.json" \
            "$GITHUB_WORKSPACE/patch-report.txt" \
            "$GITHUB_WORKSPACE/runner-report.txt" "$delivery"
          bash scripts/verify-firmware-artifacts.sh "$PROFILE" "$delivery" "$SOURCE_LOCK"

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          diagnostics="$GITHUB_WORKSPACE/diagnostics/$PROFILE"
          mkdir -p "$diagnostics"
          for file in runner-report.txt provider-selection-report.txt \
            provider-contract.txt \
            profile-feed-install-report.txt \
            artifact-override-report.json patch-report.txt profile-contract-report.txt \
            config.effective package-list.txt forbidden-packages.detected.txt \
            forbidden-suboptions-report.txt forbidden-suboptions-check.txt \
            seed-config.mismatches.txt build.parallel.log \
            build.serial.log ccache-stats.txt; do
            [ -e "$GITHUB_WORKSPACE/$file" ] && cp "$GITHUB_WORKSPACE/$file" "$diagnostics/"
          done
          [ -e "$OPENWRT_ROOT/.config" ] && cp "$OPENWRT_ROOT/.config" "$diagnostics/openwrt.config"
          [ -d "$OPENWRT_ROOT/logs" ] && tar -C "$OPENWRT_ROOT" -czf "$diagnostics/openwrt-logs.tar.gz" logs
          mapfile -d '' -t module_files < <(
            find "$OPENWRT_ROOT/build_dir" -type f \
              \( -name tcp_bbr.ko -o -name sch_fq.ko \) -print0 2>/dev/null |
              sort -z
          )
          if [ "${#module_files[@]}" -gt 0 ]; then
            relative_modules=()
            : > "$diagnostics/kernel-module-metadata.txt"
            for module in "${module_files[@]}"; do
              relative="${module#"$OPENWRT_ROOT"/}"
              relative_modules+=("$relative")
              {
                echo "module=$relative"
                if [ "$(basename "$module")" = tcp_bbr.ko ]; then
                  printf 'version='
                  python3 "$GITHUB_WORKSPACE/scripts/kernel_module_metadata.py" \
                    "$module" version || true
                fi
                printf 'vermagic='
                python3 "$GITHUB_WORKSPACE/scripts/kernel_module_metadata.py" \
                  "$module" vermagic || true
              } >> "$diagnostics/kernel-module-metadata.txt" 2>&1
            done
            tar -C "$OPENWRT_ROOT" -czf \
              "$diagnostics/kernel-module-candidates.tar.gz" -- \
              "${relative_modules[@]}"
          fi
          df -hT > "$diagnostics/disk-final.txt"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@main
        with:
          name: diagnostics-${{ matrix.profile }}
          path: diagnostics/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified firmware
        uses: actions/upload-artifact@main
        with:
          name: firmware-${{ matrix.profile }}
          path: delivery/${{ matrix.profile }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  aggregate:
    name: Assemble draft Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout implementation
        uses: actions/checkout@main

      - name: Download source lock
        uses: actions/download-artifact@main
        with:
          name: source-lock
          path: source-input

      - name: Download every profile firmware
        uses: actions/download-artifact@main
        with:
          pattern: firmware-*
          path: aggregate

      - name: Name Release
        id: naming
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(date -u +%Y.%m.%d)-r${GITHUB_RUN_NUMBER}"
          [ "$GITHUB_RUN_ATTEMPT" -eq 1 ] || release_id="${release_id}.${GITHUB_RUN_ATTEMPT}"
          printf 'release_id=%s\nrelease_tag=openwrt-%s\n' \
            "$release_id" "$release_id" >> "$GITHUB_OUTPUT"

      - name: Re-verify and assemble collision-free assets
        shell: bash
        env:
          RELEASE_ID: ${{ steps.naming.outputs.release_id }}
        run: |
          set -euo pipefail
          lock="$GITHUB_WORKSPACE/source-input/source-lock.json"
          shopt -s nullglob
          directories=("$GITHUB_WORKSPACE"/aggregate/firmware-*)
          [ "${#directories[@]}" -gt 0 ] || {
            echo '::error::No firmware artifacts were downloaded'
            exit 1
          }
          inputs=()
          for directory in "${directories[@]}"; do
            profile="${directory##*/firmware-}"
            inputs+=("$profile=$directory")
          done
          bash scripts/assemble-release.sh \
            "$lock" release-assets "$RELEASE_ID" "${inputs[@]}"

      - name: Create draft Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && github.token || secrets.ACTIONS_TRIGGER_PAT }}
          SOURCE_DIGEST: ${{ needs.prepare.outputs.source_digest }}
          RELEASE_ID: ${{ steps.naming.outputs.release_id }}
          RELEASE_TAG: ${{ steps.naming.outputs.release_tag }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo '::error::ACTIONS_TRIGGER_PAT is required to publish a workflow-changing non-default branch'
            exit 1
          }
          profiles="$(python3 scripts/source_lock.py profile-names \
            source-input/source-lock.json | paste -sd, - | sed 's/,/, /g')"
          cat > release-notes.md <<EOF
          OpenWrt R4S + N5105 PVE transactional build

          - Source-lock digest: sha256:${SOURCE_DIGEST}
          - Repository commit: ${GITHUB_SHA}
          - Profiles: ${profiles}
          - Firewall: firewall3 / iptables
          - Kernel policy: target-selected kernel channel

          The Release remains a draft until every uploaded asset is downloaded again,
          hash-checked, reconstructed, and passed through the firmware verifier.
          EOF
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --title "OpenWrt ${RELEASE_ID} · R4S + N5105 PVE" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  release-verify:
    name: Re-download and verify draft
    needs: aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout implementation
        uses: actions/checkout@main

      - name: Download every draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && github.token || secrets.ACTIONS_TRIGGER_PAT }}
          RELEASE_TAG: ${{ needs.aggregate.outputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release

      - name: Verify the downloaded transaction
        shell: bash
        run: bash scripts/verify-release-assets.sh downloaded-release

  publish-final:
    name: Publish verified Release
    needs: [aggregate, release-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the same verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && github.token || secrets.ACTIONS_TRIGGER_PAT }}
          RELEASE_TAG: ${{ needs.aggregate.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  cleanup:
    name: Retain six verified production Releases
    needs: [aggregate, publish-final]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete only excess published OpenWrt Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.ref_name == github.event.repository.default_branch && github.token || secrets.ACTIONS_TRIGGER_PAT }}
        run: |
          set -euo pipefail
          mapfile -t old_tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt,isDraft \
              --jq '[.[] | select(.isDraft == false and (.tagName | startswith("openwrt-")))] | sort_by(.createdAt) | reverse | .[6:] | .[].tagName'
          )
          for tag in "${old_tags[@]}"; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
